seed: 3
device: cuda:0
num_steps_per_env: 24
init_at_random_ep_len: true
max_iterations: 20000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: null
check_for_nan: true
save_interval: 200
experiment_name: pen_spin_sharpa_ppo
run_name: v5_3_ppo_ft
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: logs/rsl_rl/pen_spin_sharpa_ppo/2026-11-10_19-41-28_v3_2_ppo_s2/model_3200.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.8
    std_type: scalar
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0005
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.016
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  use_mixed_precision: false
  rnd_cfg: null
  symmetry_cfg: null
torch_compile_mode: null
policy: {}
